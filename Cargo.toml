[package]
name = "warp"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
